name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: cd doc/bench && go vet .
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz FuzzUnpack -fuzztime 10s
      - run: go test -run '^$' -fuzz FuzzEncodeDecode -fuzztime 10s
